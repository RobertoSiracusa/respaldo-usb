name: Compilar

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Por defecto solo lectura; el permiso de escritura se da únicamente al trabajo que publica.
permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rust estable
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy --no-self-update && rustup default stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Formato
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Pruebas
        run: cargo test --locked

      - name: Compilar release
        run: cargo build --release --locked

      - name: Suma SHA-256
        shell: pwsh
        run: |
          $hash = (Get-FileHash target/release/respaldo-usb.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  respaldo-usb.exe" | Out-File -Encoding ascii -NoNewline target/release/respaldo-usb.exe.sha256
          Get-Content target/release/respaldo-usb.exe.sha256

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: respaldo-usb-windows-x64
          path: |
            target/release/respaldo-usb.exe
            target/release/respaldo-usb.exe.sha256
          if-no-files-found: error

  # Al subir una etiqueta vX.Y.Z se publica el .exe y su suma como Release.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: respaldo-usb-windows-x64

      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" respaldo-usb.exe respaldo-usb.exe.sha256 --repo "${{ github.repository }}" --title "${{ github.ref_name }}" --generate-notes
