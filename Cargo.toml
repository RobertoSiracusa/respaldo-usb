[package]
name = "respaldo-usb"
version = "0.1.0"
edition = "2024"

[dependencies]
blake3 = "1.8.7"
chrono = "0.4.45"
dirs = "7.0.0"
eframe = "0.35.0"
globset = "0.4.21"
rfd = "0.18.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
walkdir = "2.5.0"

[dev-dependencies]
tempfile = "3.27.0"

[target."cfg(windows)".dependencies]
raw-window-handle = "0.6.2"
tray-icon = "0.26.1"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_Debug", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_Security"] }
winreg = "0.56.0"

[profile.release]
strip = true
lto = "thin"
