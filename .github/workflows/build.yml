name: Compilar

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust estable
        run: rustup toolchain install stable --profile minimal --no-self-update && rustup default stable

      - uses: Swatinem/rust-cache@v2

      - name: Pruebas
        run: cargo test --locked

      - name: Compilar release
        run: cargo build --release --locked

      - uses: actions/upload-artifact@v4
        with:
          name: respaldo-usb-windows-x64
          path: target/release/respaldo-usb.exe
          if-no-files-found: error

      # Al subir una etiqueta vX.Y.Z se publica el .exe como Release.
      - name: Publicar release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" target/release/respaldo-usb.exe --title "${{ github.ref_name }}" --generate-notes
